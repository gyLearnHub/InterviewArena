name: E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/e2e.yml"
      - "frontend/e2e/**"
      - "frontend/package-lock.json"
      - "frontend/package.json"
      - "frontend/playwright.config.ts"
      - "frontend/playwright.fullstack.config.ts"
      - "frontend/src/**"
      - "frontend/e2e-fullstack/**"
      - "backend/**"
      - "database/**"

permissions:
  contents: read

jobs:
  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium --with-deps --only-shell

      - name: Run frontend E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  fullstack-smoke:
    name: Full-stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: interview_arena
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: development
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/interview_arena
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: fullstack_smoke_jwt_secret_key_at_least_32_characters
      AUTH_COOKIE_SECURE: "false"
      AUTO_MIGRATE_ON_STARTUP: "true"
      CHROMA_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium --with-deps --only-shell

      - name: Start backend and frontend
        run: |
          python -m uvicorn main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/interviewarena-backend.log 2>&1 &
          npm --prefix frontend run dev -- --host 127.0.0.1 > /tmp/interviewarena-frontend.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health/ready >/dev/null &&
               curl --fail --silent http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/interviewarena-backend.log
          cat /tmp/interviewarena-frontend.log
          exit 1

      - name: Run real full-stack smoke
        working-directory: frontend
        run: npx playwright test --config playwright.fullstack.config.ts

      - name: Upload full-stack diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-smoke-diagnostics
          path: |
            /tmp/interviewarena-backend.log
            /tmp/interviewarena-frontend.log
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
